<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Librerías - POS Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h3>🧪 Test de Librerías JavaScript</h3>
            </div>
            <div class="card-body">
                <h5>Estado de las Librerías:</h5>
                <ul class="list-group mb-4" id="library-status">
                    <li class="list-group-item">Verificando...</li>
                </ul>
                
                <button class="btn btn-success" id="test-swal">Test SweetAlert2</button>
                <button class="btn btn-info" id="test-ajax">Test AJAX API</button>
                
                <div class="mt-4">
                    <h5>Console Output:</h5>
                    <div class="bg-dark text-light p-3 rounded" style="font-family: monospace; max-height: 300px; overflow-y: auto;" id="console-output">
                        Esperando logs...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ORDEN CORRECTO DE SCRIPTS -->
    <!-- 1. jQuery PRIMERO -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    
    <!-- 2. Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 3. SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        // Interceptar console.log para mostrar en la página
        const consoleOutput = document.getElementById('console-output');
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            consoleOutput.innerHTML += message + '\n';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };
        
        $(document).ready(function() {
            console.log('✅ jQuery cargado correctamente');
            console.log('📦 Versión jQuery:', $.fn.jquery);
            
            // Verificar librerías
            const libraries = [
                { name: 'jQuery', check: typeof $ !== 'undefined', version: $.fn.jquery },
                { name: 'Bootstrap', check: typeof bootstrap !== 'undefined', version: bootstrap.Tooltip.VERSION },
                { name: 'SweetAlert2', check: typeof Swal !== 'undefined', version: Swal.version }
            ];
            
            let html = '';
            libraries.forEach(lib => {
                const status = lib.check ? '✅' : '❌';
                const color = lib.check ? 'success' : 'danger';
                const version = lib.version ? ` (v${lib.version})` : '';
                html += `<li class="list-group-item list-group-item-${color}">
                    ${status} ${lib.name}${version}
                </li>`;
                console.log(`${status} ${lib.name}${version}`);
            });
            
            $('#library-status').html(html);
            
            // Test SweetAlert2
            $('#test-swal').click(function() {
                console.log('🔔 Probando SweetAlert2...');
                Swal.fire({
                    icon: 'success',
                    title: '¡Funciona!',
                    text: 'SweetAlert2 está funcionando correctamente',
                    timer: 2000
                });
            });
            
            // Test AJAX
            $('#test-ajax').click(function() {
                console.log('📡 Probando AJAX a API...');
                const apiUrl = '../api/v1/products.php';
                
                $.ajax({
                    url: apiUrl,
                    method: 'GET',
                    success: function(response) {
                        console.log('✅ Respuesta API:', response);
                        Swal.fire({
                            icon: 'success',
                            title: 'API Funciona',
                            html: `<pre>${JSON.stringify(response, null, 2)}</pre>`
                        });
                    },
                    error: function(xhr, status, error) {
                        console.error('❌ Error API:', {
                            status: xhr.status,
                            statusText: xhr.statusText,
                            error: error
                        });
                        Swal.fire({
                            icon: 'error',
                            title: 'Error en API',
                            text: `Status: ${xhr.status} - ${error}`
                        });
                    }
                });
            });
            
            console.log('✅ Test page inicializada correctamente');
        });
    </script>
</body>
</html>
