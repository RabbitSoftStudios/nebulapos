<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaPOS - Pago con Tarjeta / Wompi</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">NebulaPOS</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Iniciar Sesión</a></li>
                <li class="nav-item"><a class="nav-link" href="register.html">Registro</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="card-title text-center mb-4 fw-bold text-primary">Procesar Pago (Wompi)</h3>
                    <div id="payment-alert" class="alert d-none" role="alert"></div>
                    <form id="payment-form">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="amount_in_cents" class="form-label">Monto (en centavos USD/COP)</label>
                                <input type="number" class="form-control" id="amount_in_cents" name="amount_in_cents" value="10000" required>
                                <small class="text-muted">Ej: 10000 = $100.00</small>
                            </div>
                            <div class="col-md-6">
                                <label for="currency" class="form-label">Moneda</label>
                                <select class="form-select" id="currency" name="currency">
                                    <option value="COP" selected>COP</option>
                                    <option value="USD">USD</option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label for="customer_email" class="form-label">Correo del Cliente</label>
                                <input type="email" class="form-control" id="customer_email" name="customer_email" required placeholder="cliente@ejemplo.com">
                            </div>

                            <h5 class="mt-4 text-secondary">Datos de la Tarjeta de Crédito</h5>

                            <div class="col-md-12">
                                <label for="card_number" class="form-label">Número de Tarjeta</label>
                                <input type="text" class="form-control" id="card_number" name="card_number" placeholder="4242 4242 4242 4242" required>
                            </div>
                            <div class="col-md-4">
                                <label for="exp_month" class="form-label">Mes Exp.</label>
                                <input type="text" class="form-control" id="exp_month" name="exp_month" placeholder="12" maxlength="2" required>
                            </div>
                            <div class="col-md-4">
                                <label for="exp_year" class="form-label">Año Exp.</label>
                                <input type="text" class="form-control" id="exp_year" name="exp_year" placeholder="28" maxlength="2" required>
                            </div>
                            <div class="col-md-4">
                                <label for="cvc" class="form-label">CVC</label>
                                <input type="text" class="form-control" id="cvc" name="cvc" placeholder="123" maxlength="4" required>
                            </div>
                            <div class="col-md-12">
                                <label for="card_holder" class="form-label">Titular de la Tarjeta</label>
                                <input type="text" class="form-control" id="card_holder" name="card_holder" placeholder="Juan Pérez" required>
                            </div>
                            <div class="col-md-12">
                                <label for="installments" class="form-label">Cuotas</label>
                                <input type="number" class="form-control" id="installments" name="installments" value="1" min="1" max="36" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 mt-4">Pagar con Wompi</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
